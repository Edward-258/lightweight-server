services:
  gitea:
    image: docker.gitea.com/gitea:1.27.1@sha256:34e3f6b75f5cbb6aebce588037fc5a53c84213e4d4b00da0a8d73e031a558e52
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN=example.com
      - GITEA__server__SSH_DOMAIN=example.com
      - GITEA__server__ROOT_URL=https://example.com/gitea/
      # Gitea 发 Web 钩子（Woodpecker）时信任本机自签证书
      - SSL_CERT_FILE=/etc/ssl/gitea-selfsigned.pem
    restart: always
    networks:
      - gitea
    volumes:
      - /root/gitea-data:/data
      - /root/infra/config/app.ini:/data/gitea/conf/app.ini:ro
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/ssl/selfsigned/fullchain.pem:/etc/ssl/gitea-selfsigned.pem:ro
    ports:
      # HTTP 只走 nginx；Git SSH 仍对外发布
      - "2222:22"

  nginx:
    image: docker.m.daocloud.io/library/nginx:mainline-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: nginx-proxy
    restart: always
    depends_on:
      - gitea
    networks:
      - gitea
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /root/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/ssl/selfsigned:/etc/ssl/selfsigned:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
