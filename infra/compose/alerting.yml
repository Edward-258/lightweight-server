services:
  am-config:
    image: docker.m.daocloud.io/library/nginx:mainline-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    restart: "no"
    env_file:
      - .env
    volumes:
      - /root/infra/alertmanager:/work
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        : "$${SMTP_FROM:?SMTP_FROM missing in .env}"
        : "$${SMTP_AUTH_PASSWORD:?SMTP_AUTH_PASSWORD missing in .env}"
        export SMTP_SMARTHOST="$${SMTP_SMARTHOST:-smtp.qq.com:465}"
        export SMTP_AUTH_USERNAME="$${SMTP_AUTH_USERNAME:-$$SMTP_FROM}"
        export SMTP_TO="$${SMTP_TO:-$$SMTP_FROM}"
        export SMTP_FROM SMTP_AUTH_PASSWORD
        envsubst '$${SMTP_SMARTHOST} $${SMTP_FROM} $${SMTP_AUTH_USERNAME} $${SMTP_AUTH_PASSWORD} $${SMTP_TO}' \
          < /work/alertmanager.yml.tpl > /work/alertmanager.runtime.yml

  alertmanager:
    image: docker.m.daocloud.io/prom/alertmanager:latest@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    container_name: alertmanager
    restart: always
    depends_on:
      am-config:
        condition: service_completed_successfully
    networks:
      - gitea
    volumes:
      - /root/infra/alertmanager/alertmanager.runtime.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    # 不对外暴露 9093，和老项目一样只给 Prometheus 内网用
