apiVersion: 1

providers:
  - name: rfmoz-node
    orgId: 1
    folder: Node Exporter
    folderUid: rfmoz-node
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false

  - name: woodpecker
    orgId: 1
    folder: Woodpecker
    folderUid: woodpecker
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/woodpecker
      foldersFromFilesStructure: false
