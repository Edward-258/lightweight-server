global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'rules.yml'

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docker 内网 scrape。WOODPECKER_METRICS_SERVER_ADDR=:9001 是独立未鉴权口，
  # 不映射宿主机；不要写 bearer_token_file。Woodpecker 的 PROMETHEUS_AUTH_TOKEN
  # 只管主 HTTP 口上的鉴权 /metrics，不是这条 job。
  - job_name: 'woodpecker'
    metrics_path: /metrics
    static_configs:
      - targets: ['woodpecker-server:9001']
        labels:
          service: woodpecker
          component: server
