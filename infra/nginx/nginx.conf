# 边缘反代，对外身份是示例域名 example.com
# TLS：自签证书，目录 /etc/ssl/selfsigned/（对外身份使用示例域名）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream gitea_up {
    server gitea:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream prom_up {
    server prometheus:9090 max_fails=3 fail_timeout=10s;
    keepalive 8;
}
upstream grafana_up {
    server grafana:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}
upstream woodpecker_up {
    server woodpecker-server:8000 max_fails=3 fail_timeout=10s;
    keepalive 8;
}
# alpine 的 conf.d 没有现成 include 片段，代理和 gzip 写在各 server 块里

server {
    listen 80;
    server_name example.com _;

    # 留给以后 Let's Encrypt 能走通时用的 ACME 路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com _;

    ssl_certificate     /etc/ssl/selfsigned/fullchain.pem;
    ssl_certificate_key /etc/ssl/selfsigned/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- gzip（对齐旧 infra 项目）---
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/javascript application/json
                      application/xml application/xhtml+xml
                      application/rss+xml application/atom+xml
                      image/svg+xml
                      font/woff2 font/ttf font/opentype
                      application/vnd.ms-fontobject;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/plain;
        return 200 "infra\n";
    }

    location = /gitea {
        return 301 /gitea/;
    }

    location /gitea/ {
        # Gitea 容器内仍监听 /；ROOT_URL 的 /gitea/ 只是对外前缀。
        proxy_pass         http://gitea_up/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 512m;
    }

    location /grafana {
        return 301 /grafana/;
    }

    location ~ ^/grafana/(api|avatar|public|robots\.txt) {
        proxy_pass         http://grafana_up;
        proxy_redirect     off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
    }

    location /grafana/ {
        proxy_pass             http://grafana_up;
        proxy_redirect         off;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade           $http_upgrade;
        proxy_set_header       Connection        $connection_upgrade;
        proxy_set_header       Accept-Encoding   "";
        sub_filter             '</head>' '<script>!function(){var re=new RegExp("/grafana/grafana/","g");function fix(u){return u?u.replace(re,"/grafana/"):u;}var oP=history.pushState,oR=history.replaceState;history.pushState=function(s,t,u){var f=fix(u);oP.call(this,s,t,f);if(f!==u)setTimeout(function(){window.dispatchEvent(new PopStateEvent("popstate",{bubbles:false,cancelable:false,state:history.state}));},0);};history.replaceState=function(s,t,u){oR.call(this,s,t,fix(u));};}();</script></head>';
        sub_filter_once        on;
    }
    
    location = /woodpecker {
        return 301 /woodpecker/;
    }

    location /woodpecker/ {
        proxy_pass         http://woodpecker_up;
        proxy_redirect     off;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    location /prometheus/ {
        proxy_pass         http://prom_up/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
